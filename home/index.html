<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食薬AIダッシュボード</title>
    <style>
        /* デザイン設定 */
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #2e8b57; margin-bottom: 5px; }
        
        /* 画像エリア */
        #char-img { width: 100px; height: 100px; margin: 15px auto; display: block; }
        
        /* スコア表示エリア */
        .score-board { display: flex; justify-content: space-around; margin: 15px 0; background: #f0f7f4; padding: 10px; border-radius: 10px; }
        .score-item { font-size: 12px; color: #555; }
        .score-num { font-size: 18px; font-weight: bold; color: #333; }

        /* 学びのエリア */
        .message-box { background-color: #fff; border: 2px solid #66cdaa; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: left; }
        .message-title { font-weight: bold; color: #2e8b57; font-size: 14px; margin-bottom: 5px; }
        .message-text { font-size: 14px; line-height: 1.6; color: #555; }

        /* ボタン */
        .btn { display: block; width: 100%; padding: 15px 0; margin: 10px 0; border-radius: 25px; text-decoration: none; font-weight: bold; color: white; transition: 0.3s; }
        .btn-daily { background-color: #4CAF50; }
        .btn-weekly { background-color: #888; }
        
        #loading { padding: 50px; color: #888; }
        #content { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading">読み込み中...🌱</div>

        <div id="content">
            <h2 id="weekDisplay">第 -- 週目</h2>
            <p id="statusDisplay" style="font-size:12px; color:#888;">読み込み中</p>

            <!-- 画像 -->
            <img id="char-img" src="https://placehold.co/100x100/e0f7fa/006064?text=🌱" alt="Character">

            <!-- スコア表示（あなたのスクリプトに合わせてIDを設定） -->
            <div class="score-board">
                <div class="score-item">
                    昨日<br><span id="yesterdayScore" class="score-num">-</span>
                </div>
                <div class="score-item">
                    平均<br><span id="totalAvg" class="score-num">-</span>
                </div>
            </div>

            <!-- 今週の学び -->
            <div class="message-box">
                <div class="message-title">今週の学び</div>
                <div id="learningPoint" class="message-text"></div>
            </div>

            <!-- ボタン -->
            <a id="btn-daily" href="#" class="btn btn-daily">今日の記録をする</a>
            <a id="btn-weekly" href="#" class="btn btn-weekly">今週のふり返りを見る</a>
        </div>
    </div>

    <script>
        // ここが「動き」をつけるスクリプトです
        window.onload = async () => {
            // URLからIDを取得
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('user_id');

            if (!userId) {
                document.getElementById('loading').innerText = "URLにIDがありません";
                return;
            }

            try {
                // APIからデータを取得
                const res = await fetch(`/.netlify/functions/get-summary?user_id=${userId}`);
                const data = await res.json();
                
                // 1. 週数と状態の表示
                document.getElementById('weekDisplay').innerText = `第 ${data.week_no || 1} 週目`;
                document.getElementById('statusDisplay').innerText = `状態: ${data.char_status_logic || 'NORMAL'}`;

                // 2. スコアの表示（データがない場合は「-」にする）
                // ※あなたのスクリプトのロジックを採用
                document.getElementById('yesterdayScore').innerText = (data.y_base !== undefined && data.y_base !== null) ? data.y_base : "-";
                document.getElementById('totalAvg').innerText = (data.base_avg_all > 0) ? parseFloat(data.base_avg_all).toFixed(1) : "-";
                
                // 3. 学び文の表示 [1]
                document.getElementById('learningPoint').innerText = data.weekly_learning_text || "まずは自分の現状を知ることから始めましょう。";

                // 4. ボタンのリンク設定
                document.getElementById('btn-daily').href = `/daily/?user_id=${userId}`;
                document.getElementById('btn-weekly').href = `/weekly/?user_id=${userId}`;

                // 画面を表示
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "データの取得に失敗しました";
                // エラー時でも学び文のエリアにメッセージを出す
                document.getElementById('content').style.display = 'block';
                document.getElementById('learningPoint').innerText = "あなたの食薬習慣をここからサポートします。";
            }
        };
    </script>
</body>
</html>
